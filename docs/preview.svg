<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" fill="none">
  <!-- Canvas Background -->
  <rect width="640" height="300" rx="12" fill="#0f172a"/>
  
  <!-- Grid Dots -->
  <g fill="#334155" opacity="0.4">
    <circle cx="40" cy="40" r="1.5"/><circle cx="80" cy="40" r="1.5"/><circle cx="120" cy="40" r="1.5"/><circle cx="160" cy="40" r="1.5"/><circle cx="200" cy="40" r="1.5"/><circle cx="240" cy="40" r="1.5"/><circle cx="280" cy="40" r="1.5"/><circle cx="320" cy="40" r="1.5"/><circle cx="360" cy="40" r="1.5"/><circle cx="400" cy="40" r="1.5"/><circle cx="440" cy="40" r="1.5"/>
    <circle cx="40" cy="80" r="1.5"/><circle cx="80" cy="80" r="1.5"/><circle cx="120" cy="80" r="1.5"/><circle cx="160" cy="80" r="1.5"/><circle cx="200" cy="80" r="1.5"/><circle cx="240" cy="80" r="1.5"/><circle cx="280" cy="80" r="1.5"/><circle cx="320" cy="80" r="1.5"/><circle cx="360" cy="80" r="1.5"/><circle cx="400" cy="80" r="1.5"/><circle cx="440" cy="80" r="1.5"/>
    <circle cx="40" cy="120" r="1.5"/><circle cx="80" cy="120" r="1.5"/><circle cx="120" cy="120" r="1.5"/><circle cx="160" cy="120" r="1.5"/><circle cx="200" cy="120" r="1.5"/><circle cx="240" cy="120" r="1.5"/><circle cx="280" cy="120" r="1.5"/><circle cx="320" cy="120" r="1.5"/><circle cx="360" cy="120" r="1.5"/><circle cx="400" cy="120" r="1.5"/><circle cx="440" cy="120" r="1.5"/>
    <circle cx="40" cy="160" r="1.5"/><circle cx="80" cy="160" r="1.5"/><circle cx="120" cy="160" r="1.5"/><circle cx="160" cy="160" r="1.5"/><circle cx="200" cy="160" r="1.5"/><circle cx="240" cy="160" r="1.5"/><circle cx="280" cy="160" r="1.5"/><circle cx="320" cy="160" r="1.5"/><circle cx="360" cy="160" r="1.5"/><circle cx="400" cy="160" r="1.5"/><circle cx="440" cy="160" r="1.5"/>
    <circle cx="40" cy="200" r="1.5"/><circle cx="80" cy="200" r="1.5"/><circle cx="120" cy="200" r="1.5"/><circle cx="160" cy="200" r="1.5"/><circle cx="200" cy="200" r="1.5"/><circle cx="240" cy="200" r="1.5"/><circle cx="280" cy="200" r="1.5"/><circle cx="320" cy="200" r="1.5"/><circle cx="360" cy="200" r="1.5"/><circle cx="400" cy="200" r="1.5"/><circle cx="440" cy="200" r="1.5"/>
    <circle cx="40" cy="240" r="1.5"/><circle cx="80" cy="240" r="1.5"/><circle cx="120" cy="240" r="1.5"/><circle cx="160" cy="240" r="1.5"/><circle cx="200" cy="240" r="1.5"/><circle cx="240" cy="240" r="1.5"/><circle cx="280" cy="240" r="1.5"/><circle cx="320" cy="240" r="1.5"/><circle cx="360" cy="240" r="1.5"/><circle cx="400" cy="240" r="1.5"/><circle cx="440" cy="240" r="1.5"/>
  </g>

  <!-- Connection Edges (Splines) -->
  <path d="M150 90 C200 90, 200 140, 240 140" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M150 200 C200 200, 200 160, 240 160" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M370 140 C410 140, 410 80, 450 80" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <path d="M370 160 C410 160, 410 220, 450 220" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Left Node 1: Core Service (Locked) -->
  <g transform="translate(35, 55)">
    <rect width="115" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Lock Indicator -->
    <rect x="12" y="12" width="14" height="10" rx="2" fill="#64748b"/>
    <path d="M15 12 V8 A4 4 0 0 1 23 8 V12" stroke="#64748b" stroke-width="1.5" fill="none"/>
    <!-- Header bar -->
    <rect x="32" y="12" width="60" height="8" rx="2" fill="#94a3b8"/>
    <!-- Subtitle bar -->
    <rect x="12" y="32" width="85" height="5" rx="1.5" fill="#475569"/>
    <rect x="12" y="43" width="55" height="5" rx="1.5" fill="#475569"/>
    <!-- Output Port -->
    <circle cx="115" cy="35" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Left Node 2: Core Tool Service (Locked) -->
  <g transform="translate(35, 165)">
    <rect width="115" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="12" y="12" width="14" height="10" rx="2" fill="#64748b"/>
    <path d="M15 12 V8 A4 4 0 0 1 23 8 V12" stroke="#64748b" stroke-width="1.5" fill="none"/>
    <rect x="32" y="12" width="50" height="8" rx="2" fill="#94a3b8"/>
    <rect x="12" y="32" width="75" height="5" rx="1.5" fill="#475569"/>
    <rect x="12" y="43" width="45" height="5" rx="1.5" fill="#475569"/>
    <!-- Output Port -->
    <circle cx="115" cy="35" r="5" fill="#818cf8" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Center Node: Agent Preset (Editable Container Node) -->
  <g transform="translate(240, 95)">
    <rect width="130" height="110" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <!-- Amber Header tag -->
    <rect x="10" y="10" width="110" height="20" rx="4" fill="#78350f"/>
    <rect x="18" y="16" width="60" height="8" rx="2" fill="#fbbf24"/>
    <!-- Subnodes / Ports inside preset -->
    <!-- Skill Subnode -->
    <rect x="12" y="38" width="106" height="26" rx="4" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
    <circle cx="24" cy="51" r="3.5" fill="#a78bfa"/>
    <rect x="34" y="48" width="55" height="6" rx="1.5" fill="#c7d2fe"/>
    <!-- MCP Subnode -->
    <rect x="12" y="70" width="106" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <circle cx="24" cy="83" r="3.5" fill="#34d399"/>
    <rect x="34" y="80" width="55" height="6" rx="1.5" fill="#a7f3d0"/>
    <!-- Input ports on left -->
    <circle cx="0" cy="45" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
    <circle cx="0" cy="65" r="5" fill="#818cf8" stroke="#0f172a" stroke-width="2"/>
    <!-- Output ports on right -->
    <circle cx="130" cy="45" r="5" fill="#34d399" stroke="#0f172a" stroke-width="2"/>
    <circle cx="130" cy="65" r="5" fill="#a78bfa" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Right Node 1: Tool Extension Node -->
  <g transform="translate(450, 50)">
    <rect width="105" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="10" y="10" width="50" height="7" rx="2" fill="#34d399"/>
    <rect x="10" y="25" width="80" height="5" rx="1.5" fill="#475569"/>
    <rect x="10" y="36" width="60" height="5" rx="1.5" fill="#475569"/>
    <circle cx="0" cy="30" r="5" fill="#34d399" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Right Node 2: Creator Mode Draft Node -->
  <g transform="translate(450, 185)">
    <rect width="105" height="65" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="10" y="10" width="65" height="7" rx="2" fill="#fde047"/>
    <rect x="10" y="25" width="75" height="5" rx="1.5" fill="#475569"/>
    <rect x="10" y="36" width="50" height="5" rx="1.5" fill="#475569"/>
    <rect x="10" y="47" width="30" height="5" rx="1.5" fill="#ca8a04"/>
    <circle cx="0" cy="35" r="5" fill="#eab308" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Right Copilot Dock Drawer (Collapsed Tab preview) -->
  <g transform="translate(585, 20)">
    <rect width="45" height="260" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Chat Icon Glyphs -->
    <circle cx="22" cy="35" r="7" fill="#6366f1"/>
    <rect x="12" y="60" width="20" height="3" rx="1.5" fill="#64748b"/>
    <circle cx="22" cy="85" r="7" fill="#0ea5e9"/>
    <rect x="12" y="110" width="20" height="3" rx="1.5" fill="#64748b"/>
    <circle cx="22" cy="135" r="7" fill="#f59e0b"/>
  </g>
</svg>
